site_name: Syncraft
site_description: Parser/generator combinators with round-trip support
repo_url: https://github.com/afmkt/syncraft
site_url: https://afmkt.github.io/syncraft/
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite  
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - macros:
      module_name: docs/main
      include_dir: docs
  - mkdocstrings:
      handlers:
        python:
          import:
            - "https://docs.python.org/3/objects.inv"        
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            inherited_members: false
            filters: 
              - "!^_"
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Bidirectional Model: concepts/bidirectional.md
      - Performance: concepts/performance.md
  - How-To:
      - EBNF Bidirectional Grammar: how-to/ebnf-bidirectional.md
  - FAQ: faq.md
  - Reference: reference.md
