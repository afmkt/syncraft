site_name: Syncraft
site_description: Parser/generator combinators with round-trip support
repo_url: https://github.com/afmkt/syncraft
site_url: https://afmkt.github.io/syncraft/
theme:
  name: material
plugins:
  - search
  - macros:
      module_name: docs/main
      include_dir: docs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            inherited_members: false
            filters: 
              - "!^_"
nav:
  - Quickstart: quickstart.md
  - Tutorials:
      - SQLite CREATE TRIGGER Parser Tutorial: tutorials/trigger.ipynb
  - Reference: reference.md
