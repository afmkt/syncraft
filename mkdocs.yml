site_name: Syncraft
site_description: Parser/generator combinators with round-trip support
repo_url: https://github.com/afmkt/syncraft
site_url: https://afmkt.github.io/syncraft/
theme:
  name: material
plugins:
  - search
  - macros:
      module_name: docs/main
      include_dir: docs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            inherited_members: false
            filters: 
              - "!^_"
nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Bidirectional Model: concepts/bidirectional.md
      - Performance: concepts/performance.md
  - How-To:
      - EBNF Bidirectional Grammar: how-to/ebnf-bidirectional.md
  - FAQ: faq.md
  - Reference: reference.md
