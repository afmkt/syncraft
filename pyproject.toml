[project]
name = "syncraft"
version = "0.3.2"
description = "Bidirectional parser/generator combinators for Python with recursive regex-style grammar fragments."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Michael Shen", email = "mshen7310@hotmail.com"}]
keywords = ["parser", "combinator", "generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Documentation = "https://afmkt.github.io/syncraft/"
Repository = "https://github.com/afmkt/syncraft"
Issues = "https://github.com/afmkt/syncraft/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings>=0.25.0",
    "mkdocstrings-python>=1.10.0",
    "mkdocs-macros-plugin>=1.0.5",
    "graphviz>=0.21",
    "railroad-diagrams>=3.0.1",
    "rich>=14.1.0",
    "ipython>=8.0.0",
    "jupyter>=1.0.0",
    "mkdocs-jupyter>=0.24.6",
    "nbval>=0.10.0",
    "pytest-profiling>=1.8.1",
    "snakeviz>=2.2.2",
    "mypy>=1.18.2",
    "regex>=2025.11.3",
    "types-regex>=2025.11.3.20251106",
]


[tool.setuptools]
packages = ["syncraft"]

[tool.setuptools.package-data]
syncraft = ["cache/**/*", "py.typed"]
