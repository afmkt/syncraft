[project]
name = "syncraft"
version = "0.8.1"
description = "Bidirectional parser/generator combinators for Python with recursive regex-style grammar fragments."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{name = "Michael Shen", email = "mshen7310@hotmail.com"}]
keywords = ["parser", "combinator", "generator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "platformdirs>=4.9.4",
]


[project.scripts]
syncraft = "syncraft.mcp.cli:main"

[project.urls]
Documentation = "https://afmkt.github.io/syncraft/"
Repository = "https://github.com/afmkt/syncraft"
Issues = "https://github.com/afmkt/syncraft/issues"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "rich>=14.1.0",
    "pytest-profiling>=1.8.1",
    "mypy>=1.18.2",
    "marimo>=0.21.1",
]


[tool.setuptools]
packages = ["syncraft"]

[tool.setuptools.package-data]
syncraft = ["cache/**/*", "py.typed"]
"syncraft.mcp" = ['*.md']
