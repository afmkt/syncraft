name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"   # Trigger on version tags, e.g., v0.1.0 or v1.0.0-alpha

jobs:
  build-and-publish:
    name: Build and publish to PyPI/TestPyPI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify tag is on main branch
        run: |
          git fetch origin main
          TAG_COMMIT=$(git rev-parse $GITHUB_SHA)
          if ! git merge-base --is-ancestor $TAG_COMMIT origin/main; then
              echo "Tag $GITHUB_REF_NAME is not on main branch, skipping publish."
              exit 78  # neutral exit, marks job as skipped
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install uv hatchling

      - name: Build package
        run: uv build

      - name: Determine release type
        id: release_type
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            echo "release_type=prerelease" >> $GITHUB_ENV
          else
            echo "release_type=stable" >> $GITHUB_ENV
          fi

      - name: Publish to PyPI (stable)
        if: env.release_type == 'stable'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Publish to TestPyPI (pre-release)
        if: env.release_type == 'prerelease'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/
