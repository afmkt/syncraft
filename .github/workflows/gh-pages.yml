name: docs

on:
  push:
    tags:
      - 'v*.*.*'   # Deploy docs on version tag push
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Derive release version
        shell: bash
        run: |
          # Strip leading 'v' if present (e.g., v1.2.3 -> 1.2.3)
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Install deps (use source code)
        shell: bash
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          # Install the package from source code (current tag)
          pip install -e .
          # Install documentation dependencies
          pip install mkdocs mkdocs-material mkdocstrings mkdocstrings-python mkdocs-macros-plugin

      - name: Build site (clean)
        run: mkdocs build --clean --site-dir ./site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
